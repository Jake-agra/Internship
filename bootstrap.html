<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Flexbox </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .flex-box {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .flex-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="container-fluid bg-dark text-white text-center py-4">
    <h2>Bootstrap Display Flexbox </h2>
    <p>Flexbox • Justify Content • Align Items</p>
</div>

<!-- Flexbox Section -->
<div class="container-fluid bg-light py-5">
    <div class="container">

        <h4 class="text-center mb-4">Display Flex Layout</h4>

        <!-- Flex container -->
        <div class="d-flex flex-column flex-md-row 
                    justify-content-around align-items-center 
                    gap-4">

            <!-- Box 1 -->
            <div class="flex-box bg-primary text-white text-center p-4 rounded">
                <i class="bi bi-laptop fs-1"></i>
                <h5 class="mt-3">Frontend</h5>
                <p>HTML, CSS & Bootstrap</p>
            </div>

            <!-- Box 2 -->
            <div class="flex-box bg-success text-white text-center p-4 rounded">
                <i class="bi bi-code-slash fs-1"></i>
                <h5 class="mt-3">Flexbox</h5>
                <p>justify-content & align-items</p>
            </div>

            <!-- Box 3 -->
            <div class="flex-box bg-warning text-dark text-center p-4 rounded">
                <i class="bi bi-phone fs-1"></i>
                <h5 class="mt-3">Responsive</h5>
                <p>Mobile & Desktop Support</p>
            </div>

        </div>

    </div>
</div>

<!-- Footer -->
<div class="container-fluid bg-dark text-white text-center py-3">
    <small> Jake @ 2025</small>
</div>

</body>
</html>
